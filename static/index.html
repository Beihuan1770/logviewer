<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日志追踪系统</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  font-family: "Microsoft YaHei", Arial, sans-serif;
  background: #eaf2fb; color: #1f2d3d;
}
:root { --topbar-h: 56px; --gap: 8px; }

.topbar {
  height: var(--topbar-h);
  background: linear-gradient(135deg, #071734, #0a1f4f);
  color: #fff; padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between;
  position: relative;
  box-shadow: 0 4px 16px rgba(13,39,80,0.15); z-index: 10;
}
.topbar .title { font-size: 17px; font-weight: 700; letter-spacing: 2px; }
.topbar { gap: 28px; }
/* 标签绝对居中：右侧状态文字变化（实时追踪中 / 已停止）不再挤动标签位置 */
.tabs { position: absolute; left: 50%; top: 0; height: 100%; transform: translateX(-50%); display: flex; gap: 4px; align-items: center; }
.tabs a {
  color: #b9c8e4; text-decoration: none; font-size: 14px; font-weight: 600;
  padding: 7px 16px; border-radius: 9px; transition: all .15s;
}
.tabs a:hover { background: rgba(255,255,255,.08); color: #fff; }
.tabs a.active { background: #2b8cff; color: #fff; box-shadow: 0 3px 10px rgba(43,140,255,.4); }
.conn-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.conn-dot.online { background: #3fb950; }
.conn-dot.offline { background: #f85149; }
.conn-dot.tailing { background: #58a6ff; animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
.topbar-right { display: flex; align-items: center; gap: 10px; font-size: 13px; flex-shrink: 0; white-space: nowrap; }

.wrap {
  height: calc(100vh - var(--topbar-h));
  display: grid;
  grid-template-columns: minmax(290px, 38%) minmax(0, 62%);
  gap: var(--gap); padding: var(--gap); overflow: hidden;
}

.card {
  background: #fff; border-radius: 14px;
  box-shadow: 0 6px 20px rgba(15,23,42,0.06);
  display: flex; flex-direction: column; overflow: hidden; height: 100%;
}

.left-panel,
.right-panel {
  min-width: 0; overflow: hidden;
}

.left-fixed-top {
  flex-shrink: 0; padding: 8px 10px 4px 10px;
  border-bottom: 1px solid #eef2f7;
}
.section-label { font-size: 11px; letter-spacing: 3px; color: #64748b; margin-bottom: 6px; font-weight: 700; }

.path-host-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
.pathbar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; flex: 1; min-width: 0; }
.crumb { background: #e8f1ff; color: #1d4ed8; border-radius: 999px; padding: 4px 9px; font-size: 12px; cursor: pointer; white-space: nowrap; }
.crumb:hover { background: #d0e0ff; }
.host-select { flex: 0 0 200px; }
.host-select select { width: 100%; height: 34px; padding: 4px 10px; border: 1px solid #d8e2f0; border-radius: 9px; font-size: 13px; outline: none; background: #fff; }

.filter-row { display: flex; gap: 6px; margin-bottom: 6px; position: relative; }
.filter-row input { width: 100%; padding: 5px 8px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 13px; outline: none; background: #fff; color: #1f2d3d; transition: border-color .15s, box-shadow .15s; }
.filter-row input:hover { border-color: #4096ff; }
.filter-row input:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(5,145,255,.10); }

/* 时间区间选择：仿 Ant Design 双栏面板 */
.time-range { position: relative; flex: 1; display: flex; align-items: center; }
.time-range .time-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; pointer-events: none; color: #8c8c8c; }
.time-range input { padding-left: 30px; padding-right: 26px; cursor: pointer; }
.time-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: none; background: transparent; color: #bfbfbf; font-size: 14px; line-height: 1; cursor: pointer; }
.time-clear:hover { color: #ff4d4f; }
.time-pop { display: none; position: fixed; width: 566px; max-width: calc(100vw - 24px); background: #fff; border: 1px solid #f0f0f0; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.08), 0 3px 6px -4px rgba(0,0,0,.12); z-index: 50; padding: 10px 14px 12px; }
.time-pop.show { display: block; }
.time-head { display: flex; align-items: center; gap: 8px; justify-content: center; padding: 2px 0 8px; border-bottom: 1px solid #f5f5f5; }
.time-nav { border: none; background: transparent; color: #8c8c8c; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-size: 14px; line-height: 1; }
.time-nav:hover { background: #f5f5f5; color: #1677ff; }
.time-day { font-size: 14px; color: #1f1f1f; font-weight: 600; min-width: 140px; text-align: center; }
.time-tip { font-size: 11px; color: #8c8c8c; text-align: center; padding: 6px 0 2px; }
.time-cols { display: flex; gap: 14px; }
.time-col { flex: 1; min-width: 0; }
.time-col + .time-col { border-left: 1px solid #f5f5f5; padding-left: 14px; }
.time-col-title { font-size: 12px; color: #595959; text-align: center; padding: 4px 0 6px; }
.time-grid { display: block; }
.time-row { display: flex; align-items: center; gap: 2px; height: 28px; }
.time-hour { width: 20px; flex: 0 0 20px; font-size: 12px; color: #bfbfbf; text-align: right; }
.time-cell { flex: 1; min-width: 0; height: 24px; border: none; background: transparent; color: #1f1f1f; font-size: 12px; border-radius: 4px; cursor: pointer; padding: 0; line-height: 24px; text-align: center; }
.time-cell:hover { background: #f5f5f5; }
.time-cell.start, .time-cell.end { background: #1677ff; color: #fff; border-radius: 12px; }
.time-cell.inrange { background: #e6f4ff; color: #1677ff; border-radius: 0; }

.toolbar-row { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
.toolbar-row input[type="text"] { flex: 1; padding: 5px 8px; border: 1px solid #d8e2f0; border-radius: 9px; font-size: 13px; outline: none; }
.toolbar-row input[type="text"]:focus { border-color: #2b8cff; }

.btn {
  border: none; outline: none; border-radius: 9px; font-size: 12px; cursor: pointer;
  font-weight: 600; padding: 6px 12px; white-space: nowrap; transition: background 0.15s;
}
.btn-primary { background: #2b8cff; color: #fff; }
.btn-primary:hover { background: #1a7aef; }
.btn-light { background: #fff; color: #334155; border: 1px solid #d8e2f0; }
.btn-light:hover { background: #f1f5f9; }
.btn-download { background: #0f766e; color: #fff; }
.btn-download:hover { background: #0d6b63; }
.btn-download:disabled { background: #cbd5e1; color: #64748b; cursor: not-allowed; }
.btn-danger { background: #fff; color: #dc2626; border: 1px solid #fca5a5; }
.btn-danger:hover { background: #fef2f2; }
.btn-resume { background: #16a34a; color: #fff; }
.btn-resume:hover { background: #15803d; }
.btn-sm { padding: 4px 9px; font-size: 12px; border-radius: 7px; }

.status-line { font-size: 12px; color: #64748b; padding: 2px 0; }

.table-wrap {
  flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px 6px 10px;
}
table { width: 100%; border-collapse: collapse; border: 1px solid #eef2f7; border-radius: 10px; overflow: hidden; }
thead { background: #f8fafc; position: sticky; top: 0; z-index: 1; }
th, td { text-align: left; padding: 5px 7px; border-bottom: 1px solid #eef2f7; font-size: 12px; line-height: 1.3; }
th { font-weight: 700; color: #0f172a; }
tr:hover td { background: #fbfdff; }
tr.active td { background: #eff6ff; }
tr.directory td { background: #fafcff; }
tr.directory:hover td { background: #eff6ff; }
.file-link { color: #2563eb; cursor: pointer; font-weight: 600; word-break: break-all; }
.file-link:hover { text-decoration: underline; }
.file-link.active { color: #059669; }
.dir-link { color: #1d4ed8; cursor: pointer; font-weight: 700; word-break: break-all; }
.dir-link:hover { text-decoration: underline; }

.tag { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.tag-dir { background: #dbeafe; color: #1d4ed8; }
.tag-file { background: #f1f5f9; color: #475569; }

.checkbox-cell { text-align: center; width: 28px; }
.checkbox-cell input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: #2563eb; }

.right-panel .card { padding: 8px 10px; position: relative; }
.preview-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 8px; flex-shrink: 0; }
.preview-title { font-size: 14px; font-weight: 700; color: #0f172a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search-row { display: flex; gap: 6px; align-items: center; flex-shrink: 0; margin-bottom: 4px; }
.search-row input { padding: 5px 8px; border: 1px solid #d8e2f0; border-radius: 9px; font-size: 13px; outline: none; width: 180px; }
.search-row input:focus { border-color: #2b8cff; }
.line-count { font-size: 12px; color: #64748b; margin-left: auto; }

.level-filters { display: flex; gap: 4px; }
.level-btn { border: 1px solid #d8e2f0; background: #fff; color: #64748b; font-size: 11px; padding: 3px 8px; border-radius: 6px; cursor: pointer; }
.level-btn.active { background: #eef4ff; border-color: #2b8cff; color: #1d4ed8; font-weight: 600; }
.level-btn[data-level="error"].active { background: #fef2f2; border-color: #f87171; color: #b91c1c; }
.level-btn[data-level="warn"].active { background: #fffbeb; border-color: #fbbf24; color: #b45309; }

.log-box {
  flex: 1; min-height: 0; overflow-y: auto;
  border-radius: 12px; background: #0a0e13; color: #e6edf3; padding: 4px 0;
  font-family: Consolas, Monaco, "JetBrains Mono", monospace;
  font-size: 13px; line-height: 1.55;
}
.log-box::-webkit-scrollbar { width: 7px; }
.log-box::-webkit-scrollbar-track { background: transparent; }
.log-box::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

.log-line { padding: 1px 12px; white-space: pre-wrap; word-break: break-all; border-bottom: 1px solid rgba(255,255,255,0.015); }
/* 虚拟滚动的上下占位：只负责撑出滚动条高度 */
.vs-pad { width: 100%; pointer-events: none; }
.log-line:nth-child(odd) { background: rgba(255,255,255,0.008); }
.log-line .hl { background: rgba(210,153,29,0.5); padding: 0 1px; border-radius: 2px; color: #fff; }
.log-line.level-error { color: #ff7b72; background: rgba(248,81,73,0.10); border-left: 2px solid #f85149; }
.log-line.level-warn { color: #e3b341; background: rgba(210,153,29,0.10); border-left: 2px solid #d2991d; }
.log-line.level-success { color: #56d364; background: rgba(63,185,80,0.10); border-left: 2px solid #3fb950; }
/* DEBUG：粉色，和红/黄/绿/白区分，正文可读 */
.log-line.level-debug { color: #f778ba; background: rgba(247,120,186,0.10); border-left: 2px solid #f778ba; }

.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; color: #94a3b8; gap: 10px; font-size: 14px;
}
.empty-state .icon { font-size: 36px; opacity: 0.3; }

#backToBottom {
  position: absolute; bottom: 12px; right: 18px; z-index: 5;
  display: none;
}
#backToBottom.show { display: inline-block; }

@media (max-width: 900px) {
  .wrap { grid-template-columns: 1fr; overflow-y: auto; }
  .left-panel .card, .right-panel .card { height: auto; }
  .log-box { min-height: 380px; }
  .filter-row { grid-template-columns: 1fr; }
  .path-host-row { flex-direction: column; }
  .host-select { flex: 1; width: 100%; }
}
</style>
</head>
<body>

<div class="topbar">
  <div><span class="title">日志追踪系统</span></div>
  <div class="topbar-right">
    <span class="conn-dot online" id="statusDot"></span>
    <span id="statusText">就绪</span>
  </div>
</div>

<div class="wrap">
  <div class="left-panel">
    <div class="card">
      <div class="left-fixed-top">
        <div class="section-label">CURRENT PATH</div>

        <div class="path-host-row">
          <div class="pathbar" id="breadcrumb"></div>
          <div class="host-select"><select id="hostSelect"></select></div>
          <button class="btn btn-primary btn-sm" onclick="refreshDir()">刷新</button>
          <button class="btn btn-light btn-sm" onclick="goParent()">上级</button>
        </div>

        <div class="filter-row">
          <div class="time-range" id="timeRange">
            <svg class="time-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4.5 1a.5.5 0 0 1 .5.5V2h6V1.5a.5.5 0 1 1 1 0V2h1.5A1.5 1.5 0 0 1 15 3.5v10A1.5 1.5 0 0 1 13.5 15h-11A1.5 1.5 0 0 1 1 13.5v-10A1.5 1.5 0 0 1 2.5 2H4V1.5a.5.5 0 0 1 .5-.5zM2 5v8.5c0 .276.224.5.5.5h11c.276 0 .5-.224.5-.5V5H2z"/></svg>
            <input id="timeRangeInput" type="text" placeholder="选择时间范围（点两次选起止，或输入 09:00-11:30）"
                   onclick="openTimePanel()" onchange="parseTimeInput()" />
            <button type="button" class="time-clear" id="timeClearBtn" title="清除时间筛选" onclick="clearTimeRange(event)">×</button>
          </div>
        </div>

        <div class="toolbar-row">
          <input id="fileFilter" type="text" placeholder="搜索文件名..." oninput="renderFileTable()" />
          <button class="btn btn-download btn-sm" id="downloadSelectedBtn" onclick="downloadSelectedFiles()" disabled>下载所选</button>
        </div>

        <div class="status-line" id="fileStatus">请选择主机</div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="checkbox-cell"><input type="checkbox" id="selectAllChk" title="全选当前可见文件" /></th>
              <th style="width:36%">名称</th>
              <th style="width:10%">类型</th>
              <th style="width:10%">大小</th>
              <th style="width:20%">修改时间</th>
              <th style="width:24%">操作</th>
            </tr>
          </thead>
          <tbody id="fileTableBody">
            <tr><td colspan="6" class="empty-state" style="padding:20px;">选择主机查看日志文件</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="right-panel">
    <div class="card">
      <div class="preview-top">
        <div class="preview-title" id="previewTitle">日志预览</div>
        <div style="display:flex;gap:4px;flex-shrink:0;">
          <button class="btn btn-primary btn-sm" id="btnFullscreen" disabled onclick="fullscreenLog()">全屏追踪</button>
          <button class="btn btn-danger btn-sm" id="btnStop" disabled onclick="stopTail()">停止</button>
          <button class="btn btn-resume btn-sm" id="btnResume" style="display:none;" onclick="resumeTail()">继续追踪</button>
          <button class="btn btn-light btn-sm" id="btnScroll" onclick="toggleScroll()">自动: 开</button>
          <button class="btn btn-light btn-sm" onclick="clearLog()">清屏</button>
          <button class="btn btn-download btn-sm" id="btnDownload" disabled onclick="downloadFullFile()">下载完整文件</button>
        </div>
      </div>
      <div class="search-row">
        <input id="logSearchInput" type="text" placeholder="日志内容搜索..." oninput="reRenderLog()" />
        <div class="level-filters" id="levelFilters">
          <button class="level-btn active" data-level="error">错误</button>
          <button class="level-btn active" data-level="warn">警告</button>
          <button class="level-btn active" data-level="info">信息</button>
        </div>
        <span class="line-count" id="lineCount">0 行</span>
      </div>
      <div class="log-box" id="logBox">
        <div class="empty-state">
          <div class="icon">&#128226;</div>
          <div>选择日志文件开始实时查看</div>
        </div>
      </div>
      <button class="btn btn-primary btn-sm" id="backToBottom" onclick="backToBottom()">回到最新 ↓</button>
    </div>
  </div>
</div>

<script src="/ansi.js"></script>
<script src="/vscroll.js"></script>

<!-- 时间区间面板：挂在 body 上、fixed 定位，避免被卡片的 overflow 裁掉 -->
<div class="time-pop" id="timePop" onclick="event.stopPropagation()">
  <div class="time-head">
    <button type="button" class="time-nav" onclick="shiftTimeDay(-1)">‹</button>
    <span class="time-day" id="timePopDay"></span>
    <button type="button" class="time-nav" onclick="shiftTimeDay(1)">›</button>
  </div>
  <div class="time-tip" id="timePopTip">第一次点选起点，第二次点选终点</div>
  <div class="time-cols">
    <div class="time-col">
      <div class="time-col-title">上午</div>
      <div class="time-grid" id="timeGridAm"></div>
    </div>
    <div class="time-col">
      <div class="time-col-title">下午</div>
      <div class="time-grid" id="timeGridPm"></div>
    </div>
  </div>
</div>

<script>
let ws = null, reconnectTimer = null, reconnectDelay = 1000;
let connected = false, selectedHost = null, selectedFile = null;
let logFilterText = '';
let pendingLines = [], flushTimer = null;
let levelFilter = { error: true, warn: true, info: true };
let currentItems = [], visibleItems = [];
let currentPath = '';
let hosts = [];
let selectedFiles = new Set();
let lastTailedFile = null;
let currentTailId = 0;

let isAutoScroll = true;
let totalLinesLoaded = null;
let isLoadingHistory = false;
let hasMoreHistory = true;

const MAX_LINES = 30000;

const hostSelect = document.getElementById('hostSelect');
const fileTableBody = document.getElementById('fileTableBody');
const fileFilter = document.getElementById('fileFilter');
const fileStatus = document.getElementById('fileStatus');
const logBox = document.getElementById('logBox');
const logSearchInput = document.getElementById('logSearchInput');
const previewTitle = document.getElementById('previewTitle');
const btnStop = document.getElementById('btnStop');
const btnFullscreen = document.getElementById('btnFullscreen');
const btnResume = document.getElementById('btnResume');
const btnScroll = document.getElementById('btnScroll');
const btnDownload = document.getElementById('btnDownload');
const backToBottomBtn = document.getElementById('backToBottom');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const lineCountEl = document.getElementById('lineCount');
const breadcrumb = document.getElementById('breadcrumb');
const downloadSelectedBtn = document.getElementById('downloadSelectedBtn');
const selectAllChk = document.getElementById('selectAllChk');
const timeRangeInput = document.getElementById('timeRangeInput');
const timePop = document.getElementById('timePop');
const timePopDay = document.getElementById('timePopDay');
const timePopTip = document.getElementById('timePopTip');
const timeGridAm = document.getElementById('timeGridAm');
const timeGridPm = document.getElementById('timeGridPm');

// ============ 虚拟滚动容器 ============
// 数据全量留内存，DOM 只渲染可视窗口，长日志挂机也不会卡
const DEFAULT_EMPTY = '<div class="empty-state"><div class="icon">&#128226;</div><div>选择日志文件开始实时查看</div></div>';
const FILTER_EMPTY = '<div class="empty-state"><div class="icon">&#128269;</div><div>当前过滤条件下没有内容</div></div>';

const vs = new VScroll(logBox, {
  buildHtml: function (arr) {
    let html = '';
    for (let i = 0; i < arr.length; i++) html += lineHtml(arr[i]);
    return html;
  },
  emptyHtml: DEFAULT_EMPTY,
  match: passLine,
  maxLines: MAX_LINES,
  onNearTop: function () { loadPrevLines(); }
});

// ============ WebSocket ============
function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws');
  ws.onopen = () => {
    connected = true; reconnectDelay = 1000;
    updateConnStatus('online', '已连接');
    if (selectedHost) loadDir();
    if (selectedFile) startLogInit();
  };
  ws.onmessage = (evt) => {
    let msg; try { msg = JSON.parse(evt.data); } catch(e) { return; }
    handleMessage(msg);
  };
  ws.onclose = () => { connected = false; updateConnStatus('offline', '断开，重连中...'); btnStop.disabled = true; btnFullscreen.disabled = true; btnResume.style.display = 'none'; scheduleReconnect(); };
  ws.onerror = () => { ws.close(); };
}

function scheduleReconnect() {
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(() => { connect(); reconnectDelay = Math.min(reconnectDelay * 2, 30000); }, reconnectDelay);
}

function send(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
}

function updateConnStatus(cls, text) {
  statusDot.className = 'conn-dot ' + cls;
  statusText.textContent = text;
}

// ============ 消息处理 ============
function handleMessage(msg) {
  switch (msg.type) {
    case 'dir_entries':
      if (msg.host === selectedHost && msg.relPath === currentPath) {
        currentItems = msg.data || [];
        renderFileTable();
      }
      break;
    case 'init_response':
      totalLinesLoaded = msg.data.total_lines;
      hasMoreHistory = msg.data.has_more;
      dropPending();
      isAutoScroll = true;
      vs.autoScroll = true;
      btnScroll.textContent = '自动: 开';
      backToBottomBtn.classList.remove('show');
      vs.setLines(msg.data.lines || []);
      updateLineCount();
      break;
    case 'new_line':
      appendLine(msg.data);
      break;
    case 'new_lines':
      for (const line of (msg.data || [])) appendLine(line);
      break;
    case 'prev_lines':
      isLoadingHistory = false;
      const pData = msg.data;
      totalLinesLoaded = pData.total_lines;
      hasMoreHistory = pData.has_more;
      if (!pData.lines || !pData.lines.length) break;
      vs.prepend(pData.lines);
      updateLineCount();
      break;
    case 'status':
      if (msg.status === 'tailing') {
        currentTailId = msg.tailId || 0;
        updateConnStatus('tailing', '实时追踪中');
        btnStop.disabled = false;
        btnFullscreen.disabled = false;
        btnResume.style.display = 'none';
        btnDownload.disabled = false;
        selectedFile = msg.file;
        lastTailedFile = msg.file;
        previewTitle.textContent = (msg.file||'').split('/').pop();
        renderFileTable();
      } else if (msg.status === 'stopped') {
        if ((msg.tailId || 0) !== currentTailId) return;
        updateConnStatus('online', '已停止');
        btnStop.disabled = true;
        btnFullscreen.disabled = false;
        btnResume.style.display = 'inline-block';
        btnDownload.disabled = false;
      }
      break;
    case 'error':
      isLoadingHistory = false;
      updateConnStatus('online', msg.message);
      btnStop.disabled = true;
      btnFullscreen.disabled = false;
      btnResume.style.display = 'inline-block';
      break;
  }
}

// ============ 文件表格渲染 ============
function formatSize(bytes) {
  if (bytes === undefined || bytes === null || bytes === '') return '-';
  const n = Number(bytes);
  if (isNaN(n)) return '-';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
  return (n / 1073741824).toFixed(1) + ' GB';
}

function isCompressed(name) {
  const n = (name||'').toLowerCase();
  return n.endsWith('.gz') || n.endsWith('.zip') || n.endsWith('.tar') || n.endsWith('.tgz') || n.endsWith('.bz2') || n.endsWith('.xz') || n.endsWith('.7z') || n.endsWith('.rar');
}

// ============ 时间区间筛选（单框：点两次选起止，也可手输 09:00-11:30） ============
let timeStart = null, timeEnd = null;   // 应用中的区间（Date）
let timePopDate = new Date();           // 面板当前日期（只到天）
let pickStart = null, pickEnd = null;   // 面板中已选的两个时间点（当天分钟数）

function pad2(n) { return (n < 10 ? '0' : '') + n; }
function fmtMin(m) { return pad2(Math.floor(m / 60)) + ':' + pad2(m % 60); }
function dayLabel(d) {
  const w = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + w;
}
function dateAt(mins, base) {
  const d = new Date(base.getFullYear(), base.getMonth(), base.getDate());
  d.setMinutes(mins);
  return d;
}
function openTimePanel() {
  if (pickStart == null) timePopDate = new Date();
  renderTimeGrid();
  timePop.style.width = Math.min(566, window.innerWidth - 24) + 'px';
  timePop.classList.add('show');
  const r = timeRangeInput.getBoundingClientRect();
  const w = timePop.offsetWidth || 566;
  const h = timePop.offsetHeight || 420;
  let left = r.left;
  if (left + w > window.innerWidth - 12) left = Math.max(12, window.innerWidth - w - 12);
  let top = r.bottom + 6;
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
  timePop.style.left = left + 'px';
  timePop.style.top = top + 'px';
}
function closeTimePanel() { timePop.classList.remove('show'); }
function shiftTimeDay(delta) {
  timePopDate = new Date(timePopDate.getFullYear(), timePopDate.getMonth(), timePopDate.getDate() + delta);
  renderTimeGrid();
  if (pickStart != null && pickEnd != null) applyRange();
}
function renderTimeGrid() {
  timePopDay.textContent = dayLabel(timePopDate);
  timePopTip.textContent = pickStart == null
    ? '第一次点选起点，第二次点选终点'
    : (pickEnd == null ? '已选起点 ' + fmtMin(pickStart) + '，再点一次选终点'
                       : fmtMin(pickStart) + ' - ' + fmtMin(pickEnd));
  renderTimeHalf(timeGridAm, 0);
  renderTimeHalf(timeGridPm, 12);
}
// 每半栏 12 小时，每小时一行：左侧小时，右侧 6 个 10 分钟刻度
function renderTimeHalf(container, startHour) {
  let html = '';
  for (let i = 0; i < 12; i++) {
    const hour = startHour + i;
    html += '<div class="time-row"><span class="time-hour">' + pad2(hour) + '</span>';
    for (let k = 0; k < 6; k++) {
      const m = hour * 60 + k * 10;
      let cls = 'time-cell';
      if (pickStart != null && m === pickStart) cls += ' start';
      if (pickEnd != null && m === pickEnd) cls += ' end';
      if (pickStart != null && pickEnd != null && m > pickStart && m < pickEnd) cls += ' inrange';
      html += '<button type="button" class="' + cls + '" onclick="pickTime(' + m + ')" title="' + fmtMin(m) + '">' + pad2(k * 10) + '</button>';
    }
    html += '</div>';
  }
  container.innerHTML = html;
}
function pickTime(mins) {
  if (pickStart == null || pickEnd != null) {   // 首次点选，或上一轮已完成 → 重新开始
    pickStart = mins; pickEnd = null;
    renderTimeGrid();
    return;
  }
  pickEnd = mins;
  if (pickEnd < pickStart) { const t = pickStart; pickStart = pickEnd; pickEnd = t; }
  renderTimeGrid();
  applyRange();
  closeTimePanel();
}
function applyRange() {
  timeStart = dateAt(pickStart, timePopDate);
  timeEnd = dateAt(pickEnd, timePopDate);
  if (timeEnd.getTime() <= timeStart.getTime()) timeEnd = new Date(timeStart.getTime() + 60000);
  timeRangeInput.value = fmtMin(pickStart) + ' - ' + fmtMin(pickEnd) + '（' + (timePopDate.getMonth() + 1) + '/' + timePopDate.getDate() + '）';
  renderFileTable();
}
function clearTimeRange(e) {
  if (e) e.stopPropagation();
  timeStart = timeEnd = null;
  pickStart = pickEnd = null;
  timeRangeInput.value = '';
  closeTimePanel();
  renderFileTable();
}
function parseTimeInput() {
  const v = (timeRangeInput.value || '').trim();
  if (!v) { clearTimeRange(); return; }
  const m = v.match(/(\d{1,2})[:：](\d{2})\s*(?:-|~|→|to)\s*(\d{1,2})[:：](\d{2})/);
  if (!m) {
    timeRangeInput.value = timeStart ? fmtMin(pickStart) + ' → ' + fmtMin(pickEnd) : '';
    return;
  }
  let s = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  let e = parseInt(m[3], 10) * 60 + parseInt(m[4], 10);
  if (s > e) { const t = s; s = e; e = t; }
  pickStart = s; pickEnd = e;
  timePopDate = new Date();
  applyRange();
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('#timeRange')) closeTimePanel();
});

function renderFileTable() {
  const keyword = (fileFilter.value || '').toLowerCase();
  const startDate = timeStart;
  const endDate = timeEnd;

  let list = [...currentItems];

  if (keyword) {
    list = list.filter(item => (item.name||'').toLowerCase().includes(keyword));
  }
  if (startDate) {
    list = list.filter(item => { const ts = item.mtime_ts; return ts ? ts >= Math.floor(startDate.getTime()/1000) : true; });
  }
  if (endDate) {
    list = list.filter(item => { const ts = item.mtime_ts; return ts ? ts <= Math.floor(endDate.getTime()/1000) : true; });
  }

  list.sort((a, b) => {
    if (a.type === 'directory' && b.type !== 'directory') return -1;
    if (a.type !== 'directory' && b.type === 'directory') return 1;
    if (a.type === 'symlink' && b.type !== 'symlink' && b.type !== 'directory') return -1;
    if (a.type !== 'symlink' && b.type === 'symlink' && a.type !== 'directory') return 1;
    return (a.name||'').localeCompare(b.name||'', 'zh-CN');
  });

  visibleItems = list;
  const fileOnly = list.filter(item => item.type !== 'directory');
  const allChecked = fileOnly.length > 0 && fileOnly.every(item => selectedFiles.has(item.path));
  const someChecked = fileOnly.some(item => selectedFiles.has(item.path));

  selectAllChk.checked = allChecked;
  selectAllChk.indeterminate = someChecked && !allChecked;
  selectAllChk.disabled = fileOnly.length === 0;

  if (!list.length) {
    let msg = keyword ? '无匹配文件' : '当前目录为空';
    if (startDate || endDate) msg = '时间范围内无匹配文件';
    fileTableBody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:20px;">${msg}</td></tr>`;
    fileStatus.textContent = `共 0 项`;
    updateSelectionUI();
    return;
  }

  fileTableBody.innerHTML = list.map(item => {
    const isDir = item.type === 'directory';
    const isLink = item.type === 'symlink';
    const isNav = isDir || isLink;
    const name = item.name || '';
    const path = item.path || '';
    const relPath = item.rel_path || (currentPath + name);
    const isActive = !isNav && selectedFile === item.path;
    const fileOnlyPath = item.path;
    const isChecked = !isNav && selectedFiles.has(fileOnlyPath);

    let actionHtml = '';
    if (isNav) {
      actionHtml = `<button class="btn btn-light btn-sm" onclick="enterDir('${name.replace(/'/g, "\\'")}')">进入</button>`;
    } else if (isCompressed(name)) {
      actionHtml = `<button class="btn btn-download btn-sm" onclick="downloadOneFile('${fileOnlyPath.replace(/'/g, "\\'")}')">下载</button>`;
    } else {
      actionHtml = `<button class="btn btn-light btn-sm" onclick="selectFile('${fileOnlyPath.replace(/'/g, "\\'")}', '${name.replace(/'/g, "\\'")}')">查看</button>
        <button class="btn btn-light btn-sm" onclick="fullscreenLogForFile('${fileOnlyPath.replace(/'/g, "\\'")}')">全屏追踪</button>`;
    }

    return `<tr class="${isActive ? 'active' : ''} ${isNav ? 'directory' : ''}">
      <td class="checkbox-cell">
        ${isNav ? '<input type="checkbox" disabled style="opacity:0.3;">' : `<input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleFileSelection('${fileOnlyPath.replace(/'/g, "\\'")}', this.checked)" />`}
      </td>
      <td>
        ${isDir
          ? `<span class="dir-link" onclick="enterDir('${name.replace(/'/g, "\\'")}')">&#128193; ${name}/</span>`
          : isLink
          ? `<span class="dir-link" onclick="enterDir('${name.replace(/'/g, "\\'")}')">&#128279; ${name}/</span>`
          : isCompressed(name)
          ? `<span style="color:#64748b;" title="${name}">&#128230; ${name}</span>`
          : `<span class="file-link ${isActive ? 'active' : ''}" onclick="selectFile('${fileOnlyPath.replace(/'/g, "\\'")}', '${name.replace(/'/g, "\\'")}')" title="${name}">&#128196; ${name}</span>`
        }
      </td>
      <td><span class="tag ${isDir ? 'tag-dir' : isLink ? 'tag-dir' : 'tag-file'}">${isDir ? '目录' : isLink ? '链接' : '文件'}</span></td>
      <td style="color:#64748b;">${isNav ? '-' : formatSize(item.size)}</td>
      <td style="color:#64748b;font-size:12px;">${item.mtime || '-'}</td>
      <td>${actionHtml}</td>
    </tr>`;
  }).join('');

  let msg = `共 ${list.length} 项` + (keyword ? `（筛选自 ${currentItems.length} 项）` : '');
  if (selectedFiles.size > 0) msg += ` | 已选 ${selectedFiles.size} 个文件`;
  fileStatus.textContent = msg;
  updateSelectionUI();
}

// ============ 日志输出 ============
// ============ 日志等级着色 ============
// 划分：错误=红，警告=黄，成功=绿，普通（INFO/DEBUG/无等级）=白
// 先认行首的显式等级字段（level=error / [WARN] / "ERROR 1234 ---" 等），
// 没有等级字段再按整行关键字兜底，避免把正文里的 success/error 当成等级。
const LEVEL_CLASS = {
  error: 'level-error', err: 'level-error', fatal: 'level-error', panic: 'level-error',
  critical: 'level-error', crit: 'level-error', severe: 'level-error', emerg: 'level-error', alert: 'level-error',
  warn: 'level-warn', warning: 'level-warn',
  success: 'level-success', ok: 'level-success', pass: 'level-success', passed: 'level-success',
  done: 'level-success', completed: 'level-success',
  info: '', notice: '', debug: 'level-debug', trace: '', verbose: ''
};

function levelClass(line) {
  // 先剥掉 ANSI 转义，避免彩色日志行首的转义码干扰等级识别
  const plain = line.indexOf('\x1b') === -1 ? line : Ansi.strip(line);
  const head = plain.slice(0, 120);
  let lv = '';
  const kv = head.match(/(?:level|severity|lvl)"?\s*[=:]\s*"?([a-zA-Z]+)/);
  if (kv) lv = kv[1].toLowerCase();
  if (!lv) {
    const tok = head.match(/(?:^|[\s\[|(])(TRACE|DEBUG|VERBOSE|INFO|NOTICE|SUCCESS|OK|WARN|WARNING|ERROR|ERR|FATAL|PANIC|CRITICAL|SEVERE|ALERT|EMERG)(?=[\s\]|):,;-]|$)/i);
    if (tok) lv = tok[1].toLowerCase();
  }
  if (lv && LEVEL_CLASS[lv] !== undefined) return LEVEL_CLASS[lv];

  if (/\b(?:error|fatal|panic|critical|exception|failed|failure|refused)\b/i.test(plain) || /失败|错误|异常|崩溃|未完成/.test(plain)) return 'level-error';
  if (/\b(?:warn|warning)\b/i.test(plain) || /警告|告警|超时/.test(plain)) return 'level-warn';
  if (/\b(?:success|succeeded|successful|completed|passed|ok|okay)\b/i.test(plain) || /成功|已启动|已完成|就绪/.test(plain)) return 'level-success';
  return '';
}

// 一行日志 → HTML：等级着色 + ANSI 彩色转义 + 关键字高亮（日志内容一律转义，防注入）
function lineHtml(line) {
  const cls = levelClass(line);
  return '<div class="log-line' + (cls ? ' ' + cls : '') + '">' + Ansi.render(line, logFilterText) + '</div>';
}

function appendLine(line) {
  pendingLines.push(line);
  scheduleFlush();
}

// 等级归类：错误 / 警告 / 其余都算信息
function levelKind(line) {
  const c = levelClass(line);
  if (c === 'level-error') return 'error';
  if (c === 'level-warn') return 'warn';
  return 'info';
}

// 文本过滤 + 等级过滤，两处渲染共用
function passLine(line) {
  if (logFilterText && !Ansi.strip(line).toLowerCase().includes(logFilterText)) return false;
  return !!levelFilter[levelKind(line)];
}

function scheduleFlush() {
  if (flushTimer) return;
  flushTimer = setTimeout(flushLines, 120);
}

// 批量渲染：120ms 汇总一次，交给虚拟滚动只渲染窗口内的行
function flushLines() {
  flushTimer = null;
  if (!pendingLines.length) return;
  const batch = pendingLines;
  pendingLines = [];
  vs.autoScroll = isAutoScroll;
  vs.append(batch);
  updateLineCount();
}

function dropPending() {
  pendingLines = [];
  clearTimeout(flushTimer);
  flushTimer = null;
}

  if (e.ctrlKey && e.key === 'l') { e.preventDefault(); clearLog(); }
});

logBox.addEventListener('scroll', () => {
  // 虚拟滚动正在改窗口/占位时不参与自动滚动判定，避免误判
  if (vs.busy) return;
  const distToBottom = logBox.scrollHeight - logBox.scrollTop - logBox.clientHeight;
  if (distToBottom <= 10) {
    isAutoScroll = true;
    vs.autoScroll = true;
    btnScroll.textContent = '自动: 开';
    backToBottomBtn.classList.remove('show');
  } else {
    isAutoScroll = false;
    vs.autoScroll = false;
    btnScroll.textContent = '自动: 关';
    backToBottomBtn.classList.add('show');
  }
});

// ============ 等级过滤 ============
document.querySelectorAll('.level-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const lv = btn.dataset.level;
    levelFilter[lv] = !levelFilter[lv];
    btn.classList.toggle('active', levelFilter[lv]);
    reRenderLog();
  });
});

// ============ 后台自动暂停 ============
let idlePauseMinutes = 30;
let idleTimer = null;
let pausedByIdle = false;

fetch('/api/settings').then(r => r.json()).then(d => {
  if (d && typeof d.idle_pause_minutes === 'number') idlePauseMinutes = d.idle_pause_minutes;
}).catch(() => {});

function scheduleIdlePause() {
  clearTimeout(idleTimer);
  if (!idlePauseMinutes || idlePauseMinutes <= 0) return;
  idleTimer = setTimeout(() => {
    if (document.visibilityState !== 'hidden') return;
    if (!selectedFile || btnStop.disabled) return;
    pausedByIdle = true;
    stopTail();
    updateConnStatus('online', '已暂停（后台 ' + idlePauseMinutes + ' 分钟）');
  }, idlePauseMinutes * 60 * 1000);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    scheduleIdlePause();
  } else {
    clearTimeout(idleTimer);
    if (pausedByIdle) {
      pausedByIdle = false;
      resumeTail();
    }
  }
});

// ============ 初始化 ============
loadHosts(); connect();
</script>
</body>
</html>
