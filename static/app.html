<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>应用日志 - 日志追踪系统</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Microsoft YaHei", Arial, sans-serif; background: #eaf2fb; color: #1f2d3d; }
:root { --topbar-h: 56px; --toolbar-h: 52px; }

.topbar {
  height: var(--topbar-h); background: linear-gradient(135deg,#071734,#0a1f4f); color: #fff;
  padding: 0 20px; display: flex; align-items: center; gap: 28px; justify-content: space-between;
  box-shadow: 0 4px 16px rgba(13,39,80,.15); position: relative; z-index: 10;
}
.brand { font-size: 17px; font-weight: 700; letter-spacing: 2px; }
.tabs { display: flex; gap: 4px; align-self: stretch; align-items: center; }
.tabs a {
  color: #b9c8e4; text-decoration: none; font-size: 14px; font-weight: 600;
  padding: 7px 16px; border-radius: 9px; transition: all .15s;
}
.tabs a:hover { background: rgba(255,255,255,.08); color: #fff; }
.tabs a.active { background: #2b8cff; color: #fff; box-shadow: 0 3px 10px rgba(43,140,255,.4); }
.topbar-right { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.conn-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.conn-dot.online { background: #3fb950; }
.conn-dot.offline { background: #f85149; }

.toolbar {
  height: var(--toolbar-h); display: flex; align-items: center; gap: 10px;
  padding: 0 14px; background: #fff; border-bottom: 1px solid #e3ebf7;
}
.toolbar label { font-size: 12px; color: #64748b; letter-spacing: 2px; font-weight: 700; }
.toolbar select {
  height: 34px; min-width: 220px; padding: 4px 10px; border: 1px solid #d8e2f0;
  border-radius: 9px; font-size: 13px; background: #fff; outline: none;
}
.toolbar select:focus { border-color: #2b8cff; }
.toolbar input {
  height: 34px; width: 260px; padding: 5px 10px; border: 1px solid #d8e2f0;
  border-radius: 9px; font-size: 13px; outline: none;
}
.toolbar input:focus { border-color: #2b8cff; }
.spacer { flex: 1; }
.meta { font-size: 12px; color: #7b8aa3; }
.btn {
  border: none; outline: none; border-radius: 9px; font-size: 12px; cursor: pointer;
  font-weight: 600; padding: 6px 12px; white-space: nowrap; transition: background .15s;
}
.btn-primary { background: #2b8cff; color: #fff; }
.btn-primary:hover { background: #1a7aef; }
.btn-light { background: #fff; color: #334155; border: 1px solid #d8e2f0; }
.btn-light:hover { background: #f1f5f9; }
.btn-download { background: #0f766e; color: #fff; }
.btn-download:hover { background: #0d6b63; }
.btn-sm { padding: 4px 9px; font-size: 12px; border-radius: 7px; }

.panes {
  height: calc(100vh - var(--topbar-h) - var(--toolbar-h));
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(420px, 1fr);
  gap: 8px; padding: 8px; overflow-x: auto; overflow-y: hidden;
}
.pane {
  display: flex; flex-direction: column; background: #fff; border-radius: 14px;
  box-shadow: 0 6px 20px rgba(15,23,42,.06); overflow: hidden; min-width: 0;
}
.pane header { padding: 8px 10px; border-bottom: 1px solid #eef2f7; flex-shrink: 0; }
.pane-title { font-size: 14px; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 8px; }
.pane-title .addr { font-size: 12px; font-weight: 500; color: #64748b; }
.pane-path { font-size: 11px; color: #8794a8; margin-top: 2px; word-break: break-all; }
.pane-actions { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.pane-actions .spacer { flex: 1; }
.pstat { font-size: 12px; color: #64748b; }
.pstat.tailing { color: #0b7a3e; font-weight: 600; }
.pstat.offline { color: #dc2626; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; display: inline-block; }
.dot.tailing { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.18); }
.dot.offline { background: #ef4444; }

.logbox {
  flex: 1; min-height: 0; overflow-y: auto; background: #0a0e13; color: #e6edf3;
  padding: 4px 0; font-family: Consolas, Monaco, "JetBrains Mono", monospace;
  font-size: 13px; line-height: 1.55;
}
.logbox::-webkit-scrollbar { width: 7px; }
.logbox::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
.log-line { padding: 1px 10px; white-space: pre-wrap; word-break: break-all; border-bottom: 1px solid rgba(255,255,255,.015); }
.log-line:nth-child(odd) { background: rgba(255,255,255,.008); }
.log-line .hl { background: rgba(210,153,29,.5); padding: 0 1px; border-radius: 2px; color: #fff; }
.log-line.level-error { color: #ff7b72; background: rgba(248,81,73,.10); border-left: 2px solid #f85149; }
.log-line.level-warn { color: #e3b341; background: rgba(210,153,29,.10); border-left: 2px solid #d2991d; }
.log-line.level-success { color: #56d364; background: rgba(63,185,80,.10); border-left: 2px solid #3fb950; }
.pane footer {
  height: 26px; display: flex; align-items: center; gap: 10px; padding: 0 10px;
  border-top: 1px solid #eef2f7; font-size: 11px; color: #7b8aa3; background: #fbfdff; flex-shrink: 0;
}
.pane footer .grow { flex: 1; }
.empty { padding: 24px; text-align: center; color: #94a3b8; font-size: 13px; }
.placeholder { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 14px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">日志追踪系统<span id="appVer" style="font-size:12px;color:#94a3b8;font-weight:500;letter-spacing:0;margin-left:8px;"></span></div>
  <nav class="tabs">
    <a href="/index.html">主机日志</a>
    <a href="/app.html" class="active">应用日志</a>
    <a href="/tail.html">路径追踪</a>
  </nav>
  <div class="topbar-right">
    <span class="conn-dot online" id="statusDot"></span>
    <span id="statusText">就绪</span>
  </div>
</div>

<div class="toolbar">
  <label>APPLICATION</label>
  <select id="appSelect"></select>
  <button class="btn btn-primary btn-sm" id="btnReload">重新连接</button>
  <span class="meta" id="appMeta"></span>
  <span class="spacer"></span>
  <input id="filterInput" type="text" placeholder="全部面板过滤（日志内容）..." />
  <button class="btn btn-light btn-sm" id="btnAuto"><span id="autoText">自动滚动: 开</span></button>
</div>

<div class="panes" id="panes">
  <div class="placeholder">正在加载应用列表…</div>
</div>

<script>
const MAX_LINES = 20000;

const panesEl = document.getElementById('panes');
const appSelect = document.getElementById('appSelect');
const appMeta = document.getElementById('appMeta');
const filterInput = document.getElementById('filterInput');
const btnReload = document.getElementById('btnReload');
const btnAuto = document.getElementById('btnAuto');
const autoText = document.getElementById('autoText');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');

let apps = [];
let panes = [];
let autoScroll = true;
let filterText = '';

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 日志等级着色：错误=红，警告=黄，成功=绿，普通（INFO/DEBUG/无等级）=白
// 先认行首的显式等级字段（level=error / [WARN] / "ERROR 1234 ---" 等），
// 没有等级字段再按整行关键字兜底，避免把正文里的 success/error 当成等级。
const LEVEL_CLASS = {
  error: 'level-error', err: 'level-error', fatal: 'level-error', panic: 'level-error',
  critical: 'level-error', crit: 'level-error', severe: 'level-error', emerg: 'level-error', alert: 'level-error',
  warn: 'level-warn', warning: 'level-warn',
  success: 'level-success', ok: 'level-success', pass: 'level-success', passed: 'level-success',
  done: 'level-success', completed: 'level-success',
  info: '', notice: '', debug: '', trace: '', verbose: ''
};

function lineClass(line) {
  const head = line.slice(0, 120);
  let lv = '';
  const kv = head.match(/(?:level|severity|lvl)"?\s*[=:]\s*"?([a-zA-Z]+)/);
  if (kv) lv = kv[1].toLowerCase();
  if (!lv) {
    const tok = head.match(/(?:^|[\s\[|(])(TRACE|DEBUG|VERBOSE|INFO|NOTICE|SUCCESS|OK|WARN|WARNING|ERROR|ERR|FATAL|PANIC|CRITICAL|SEVERE|ALERT|EMERG)(?=[\s\]|):,;-]|$)/i);
    if (tok) lv = tok[1].toLowerCase();
  }
  if (lv && LEVEL_CLASS[lv] !== undefined) return LEVEL_CLASS[lv];

  if (/\b(?:error|fatal|panic|critical|exception|failed|failure|refused)\b/i.test(line) || /失败|错误|异常|崩溃|未完成/.test(line)) return 'level-error';
  if (/\b(?:warn|warning)\b/i.test(line) || /警告|告警|超时/.test(line)) return 'level-warn';
  if (/\b(?:success|succeeded|successful|completed|passed|ok|okay)\b/i.test(line) || /成功|已启动|已完成|就绪/.test(line)) return 'level-success';
  return '';
}

function lineHtml(line, filter) {
  let html = esc(line);
  if (filter) {
    const escRe = filter.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    html = html.replace(new RegExp('(' + escRe + ')', 'gi'), '<span class="hl">$1</span>');
  }
  return '<div class="log-line ' + lineClass(line) + '">' + html + '</div>';
}

class Pane {
  constructor(app, src, index) {
    this.app = app;
    this.src = src;
    this.index = index;
    this.lines = [];
    this.stopped = false;
    this.ws = null;
    this.retry = 1000;
    this.timer = null;
    this.progScroll = false;
    this.progTimer = null;
    this.pending = [];
    this.flushTimer = null;
    this.totalLoaded = null;
    this.hasMore = true;
    this.loadingPrev = false;
    this.el = this.build();
  }

  build() {
    const el = document.createElement('section');
    const fname = (this.src.path || '').split('/').pop();
    el.className = 'pane';
    el.innerHTML = `
      <header>
        <div class="pane-title"><span class="dot" data-dot></span>${esc(this.src.host_label)}
          <span class="addr">${esc(this.src.addr)} · ${esc(fname)}</span></div>
        <div class="pane-path">${esc(this.src.path)}</div>
        <div class="pane-actions">
          <span class="pstat" data-status>连接中…</span>
          <span class="spacer"></span>
          <button class="btn btn-light btn-sm" data-act="stop">暂停</button>
          <button class="btn btn-primary btn-sm" data-act="resume" style="display:none">继续</button>
          <button class="btn btn-light btn-sm" data-act="fullscreen">全屏</button>
          <button class="btn btn-download btn-sm" data-act="download">下载</button>
        </div>
      </header>
      <div class="logbox" data-log></div>
      <footer><span data-count>0 行</span><span class="grow"></span><span data-hint>实时追踪</span></footer>`;
    this.logBox = el.querySelector('[data-log]');
    this.statusEl = el.querySelector('[data-status]');
    this.dotEl = el.querySelector('[data-dot]');
    this.countEl = el.querySelector('[data-count]');
    this.hintEl = el.querySelector('[data-hint]');

    el.querySelector('[data-act="stop"]').onclick = () => this.stop();
    el.querySelector('[data-act="resume"]').onclick = () => this.resume();
    el.querySelector('[data-act="download"]').onclick = () => {
      window.open('/api/download?host=' + encodeURIComponent(this.src.host_id) + '&file=' + encodeURIComponent(this.src.path), '_blank');
    };
    el.querySelector('[data-act="fullscreen"]').onclick = () => {
      window.open('/fullscreen.html?host=' + encodeURIComponent(this.src.host_id) + '&file=' + encodeURIComponent(this.src.path), '_blank');
    };

    this.logBox.addEventListener('scroll', () => {
      if (this.progScroll) return;
      const box = this.logBox;
      if (box.scrollHeight - box.scrollTop - box.clientHeight > 30 && autoScroll) setAuto(false);
      if (box.scrollTop < 40) this.loadPrev();
    });
    this.logBox.addEventListener('wheel', (e) => {
      if (e.deltaY < 0 && autoScroll) setAuto(false);
    }, { passive: true });
    return el;
  }

  setStatus(text, cls) {
    this.statusEl.textContent = text;
    this.statusEl.className = 'pstat ' + (cls || '');
    this.dotEl.className = 'dot ' + (cls || '');
  }

  connect() {
    clearTimeout(this.timer);
    if (this.ws) { try { this.ws.close(); } catch (e) {} }
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(proto + '//' + location.host + '/ws');
    this.ws = ws;
    this.stopped = false;

    ws.onopen = () => {
      this.retry = 1000;
      this.setStatus('连接中…', '');
      this.send({ type: 'init', host: this.src.host_id, file: this.src.path });
    };
    ws.onmessage = (ev) => {
      let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
      this.handle(msg);
    };
    ws.onclose = () => {
      if (this.stopped) return;
      this.setStatus('已断开，重连中…', 'offline');
      this.timer = setTimeout(() => this.connect(), this.retry);
      this.retry = Math.min(this.retry * 2, 30000);
    };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }

  send(obj) {
    if (this.ws && this.ws.readyState === WebSocket.OPEN) this.ws.send(JSON.stringify(obj));
  }

  handle(msg) {
    switch (msg.type) {
      case 'init_response':
        this.lines = [];
        this.pending = [];
        clearTimeout(this.flushTimer);
        this.flushTimer = null;
        this.totalLoaded = msg.data.total_lines;
        this.hasMore = !!msg.data.has_more;
        this.loadingPrev = false;
        this.logBox.innerHTML = '';
        (msg.data.lines || []).forEach(l => {
          this.lines.push(l);
        });
        this.renderAll();
        this.updateCount();
        this.scrollBottom();
        break;
      case 'prev_lines': {
        this.loadingPrev = false;
        const d = msg.data || {};
        if (d.total_lines != null) this.totalLoaded = d.total_lines;
        this.hasMore = !!d.has_more;
        const newLines = d.lines || [];
        if (!newLines.length) break;
        const beforeH = this.logBox.scrollHeight;
        const beforeTop = this.logBox.scrollTop;
        const frag = document.createDocumentFragment();
        for (const l of newLines) {
          if (this.match(l)) frag.appendChild(this.makeNode(l));
        }
        this.lines = newLines.concat(this.lines);
        if (this.lines.length > MAX_LINES) this.lines.length = MAX_LINES;
        if (frag.childNodes.length) this.logBox.insertBefore(frag, this.logBox.firstChild);
        while (this.logBox.childElementCount > 6000) {
          this.logBox.removeChild(this.logBox.lastElementChild);
        }
        this.progScroll = true;
        this.logBox.scrollTop = beforeTop + (this.logBox.scrollHeight - beforeH);
        clearTimeout(this.progTimer);
        this.progTimer = setTimeout(() => { this.progScroll = false; }, 150);
        this.updateCount();
        break;
      }
      case 'new_line':
        this.lines.push(msg.data);
        if (this.lines.length > MAX_LINES) this.lines.shift();
        this.pending.push(msg.data);
        this.scheduleFlush();
        this.updateCount();
        break;
      case 'status':
        if (msg.status === 'tailing') {
          this.setStatus('实时追踪中', 'tailing');
          this.hintEl.textContent = '实时追踪';
        } else if (msg.status === 'stopped') {
          this.setStatus('已暂停', '');
          this.hintEl.textContent = '已暂停';
        }
        break;
      case 'error':
        this.setStatus(msg.message || '出错了', 'offline');
        this.hintEl.textContent = msg.message || '';
        if (!this.lines.length) {
          this.logBox.innerHTML = '<div class="empty">' + esc(msg.message || '无法读取日志') + '</div>';
        }
        break;
    }
  }

  match(line) {
    return !filterText || line.toLowerCase().indexOf(filterText) !== -1;
  }

  makeNode(line) {
    const div = document.createElement('div');
    div.className = 'log-line ' + lineClass(line);
    if (filterText) {
      const escRe = filterText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      div.innerHTML = esc(line).replace(new RegExp('(' + escRe + ')', 'gi'), '<span class="hl">$1</span>');
    } else {
      div.textContent = line;
    }
    return div;
  }

  scheduleFlush() {
    if (this.flushTimer) return;
    this.flushTimer = setTimeout(() => this.flush(), 150);
  }

  flush() {
    this.flushTimer = null;
    if (!this.pending.length) return;
    const frag = document.createDocumentFragment();
    for (const l of this.pending) {
      if (this.match(l)) frag.appendChild(this.makeNode(l));
    }
    this.pending = [];
    if (frag.childNodes.length) this.logBox.appendChild(frag);
    while (this.logBox.childElementCount > 6000) {
      this.logBox.removeChild(this.logBox.firstElementChild);
    }
    if (autoScroll) this.scrollBottom();
  }

  renderAll() {
    if (filterText) {
      let html = '';
      for (const l of this.lines) if (this.match(l)) html += lineHtml(l, filterText);
      this.logBox.innerHTML = html || '<div class="empty">无匹配内容</div>';
    } else {
      let html = '';
      for (const l of this.lines) html += lineHtml(l, '');
      this.logBox.innerHTML = html;
    }
    this.scrollBottom();
  }

  scrollBottom() {
    this.progScroll = true;
    this.logBox.scrollTop = this.logBox.scrollHeight;
    clearTimeout(this.progTimer);
    this.progTimer = setTimeout(() => { this.progScroll = false; }, 150);
  }

  loadPrev() {
    if (this.loadingPrev || !this.hasMore || this.totalLoaded == null) return;
    this.loadingPrev = true;
    this.send({
      type: 'load_prev',
      host: this.src.host_id,
      file: this.src.path,
      params: { skip_lines: this.totalLoaded, limit: 200 }
    });
  }

  updateCount() {
    this.countEl.textContent = this.lines.length.toLocaleString() + ' 行';
  }

  stop() {
    this.stopped = true;
    this.send({ type: 'stop' });
    this.setStatus('已暂停', '');
    this.el.querySelector('[data-act="stop"]').style.display = 'none';
    this.el.querySelector('[data-act="resume"]').style.display = '';
  }

  resume() {
    this.stopped = false;
    this.el.querySelector('[data-act="stop"]').style.display = '';
    this.el.querySelector('[data-act="resume"]').style.display = 'none';
    this.connect();
  }

  close() {
    this.stopped = true;
    clearTimeout(this.timer);
    if (this.ws) { try { this.ws.close(); } catch (e) {} }
  }
}

function setAuto(on) {
  autoScroll = on;
  autoText.textContent = '自动滚动: ' + (on ? '开' : '关');
  if (on) panes.forEach(p => p.scrollBottom());
}
btnAuto.onclick = () => setAuto(!autoScroll);

function renderApp(app) {
  panes.forEach(p => p.close());
  panes = [];
  panesEl.innerHTML = '';
  if (!app.sources || !app.sources.length) {
    panesEl.innerHTML = '<div class="placeholder">该应用没有配置任何日志源</div>';
    return;
  }
  app.sources.forEach((src, i) => {
    const pane = new Pane(app, src, i);
    panes.push(pane);
    panesEl.appendChild(pane.el);
    pane.connect();
  });
  appMeta.textContent = '共 ' + app.sources.length + ' 个日志源';
}

function selectApp(id, push) {
  const app = apps.find(a => a.id === id);
  if (!app) return;
  appSelect.value = id;
  if (push) history.replaceState(null, '', '?app=' + encodeURIComponent(id));
  renderApp(app);
}

appSelect.onchange = () => selectApp(appSelect.value, true);
btnReload.onclick = () => {
  const id = appSelect.value;
  if (id) selectApp(id, false);
};

let filterTimer = null;
filterInput.oninput = () => {
  clearTimeout(filterTimer);
  filterTimer = setTimeout(() => {
    filterText = filterInput.value.trim().toLowerCase();
    panes.forEach(p => { p.renderAll(); p.updateCount(); });
  }, 200);
};

async function boot() {
  try {
    const resp = await fetch('/api/apps');
    apps = await resp.json();
  } catch (e) {
    statusDot.className = 'conn-dot offline';
    statusText.textContent = '加载应用列表失败';
    panesEl.innerHTML = '<div class="placeholder">加载应用列表失败</div>';
    return;
  }
  if (!apps.length) {
    panesEl.innerHTML = '<div class="placeholder">config.yaml 里还没有配置应用</div>';
    return;
  }
  appSelect.innerHTML = apps.map(a => '<option value="' + esc(a.id) + '">' + esc(a.label) + '（' + esc(a.id) + '）</option>').join('');
  const want = new URLSearchParams(location.search).get('app');
  const initial = apps.find(a => a.id === want) ? want : apps[0].id;
  selectApp(initial, false);
  statusDot.className = 'conn-dot online';
  statusText.textContent = '已就绪';
}

boot();
</script>
<script>
// 版本号：统一从 /api/version 读（main.go 里的 version 变量），取不到就留空
fetch('/api/version').then(function (r) { return r.json(); }).then(function (d) {
  var el = document.getElementById('appVer');
  if (el) el.textContent = d.version || '';
}).catch(function () { });
</script>
</body>
</html>
